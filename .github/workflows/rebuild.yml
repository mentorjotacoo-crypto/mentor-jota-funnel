name: Rebuild funnel dashboard

on:
  repository_dispatch:
    types: [update-funnel]
  workflow_dispatch:
  # La tarea del PC commitea ascensos.enc/closers.enc varias veces al día; antes
  # el tablero solo los incorporaba en los 3 dispatch del tracker (hasta 6 h de
  # rezago). atribucion.enc queda fuera a propósito: cambia cada 2 horas y
  # multiplicaría los builds; la recoge el siguiente rebuild. El commit del
  # index.html no toca estos archivos, así que no se dispara a sí mismo.
  push:
    branches: [main]
    paths:
      - 'ascensos.enc'
      - 'closers.enc'

permissions:
  contents: write

# Un solo build a la vez, en cola (no se cancela el que va): un rebuild por push
# que coincida con el dispatch del tracker no debe chocar en el push final.
concurrency:
  group: rebuild-funnel
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Siempre la PUNTA de main, no el commit del evento: un build que esperó en
      # la cola (concurrency) arrancaba sobre un index.html ya reemplazado por el
      # build anterior y el push final chocaba en las mismas dos líneas.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # El Apps Script manda el tracker de dos formas y aquí se aceptan ambas:
      #   · comprimido (desde 2026-10-07): { formato:'gzip-base64', gz:'<base64>' }
      #   · plano (versión anterior): el JSON del tracker tal cual
      # Así no importa cuál copia del script esté pegada en Google.
      - name: Write data.json from dispatch payload
        if: github.event_name == 'repository_dispatch'
        # El payload se lee del archivo del evento ($GITHUB_EVENT_PATH), NO de una
        # variable `env:`: GitHub imprime en el log el valor de cada variable del
        # paso, y este repo es público. Desde abril de 2026 cada sincronización
        # dejaba en un log abierto todo el tracker (gasto, ventas e ingresos por
        # día) y la llave de escritura de Observaciones, lo mismo que el tablero
        # publica cifrado. (Detectado el 7-oct-2026.)
        run: |
          node -e '
            const zlib = require("zlib"), fs = require("fs");
            const p = (JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, "utf8")) || {}).client_payload || null;
            if (!p || typeof p !== "object") { console.error("client_payload vacio"); process.exit(1); }
            let json;
            if (typeof p.gz === "string" && !p.days) {
              json = zlib.gunzipSync(Buffer.from(p.gz, "base64")).toString("utf8");
              console.log("Payload comprimido: " + p.gz.length + " chars base64 -> " + json.length + " bytes de JSON");
            } else {
              json = JSON.stringify(p);
              console.log("Payload plano: " + json.length + " bytes");
            }
            const d = JSON.parse(json);
            if (!d.days || !Object.keys(d.days).length) { console.error("El payload no trae dias"); process.exit(1); }
            fs.writeFileSync("data.json", json);
            console.log("data.json: " + Object.keys(d.days).length + " dias, sincronizado " + d.updatedAt);
          '

      - name: Build encrypted index.html
        env:
          FUNNEL_PASSWORD: ${{ secrets.FUNNEL_PASSWORD }}
        run: |
          if [ -z "$FUNNEL_PASSWORD" ]; then
            echo "ERROR: FUNNEL_PASSWORD secret no configurado"
            exit 1
          fi
          node build.js "$FUNNEL_PASSWORD"

      # index.html se GENERA, no se fusiona: si el push se rechaza (entró otro
      # commit: la tarea del PC publica .enc cada 2 h, u otro rebuild) no se
      # rebasa — cada build reescribe el payload completo y el rebase choca
      # siempre. Se vuelve a la punta de main, se reconstruye y se reintenta.
      # data.json está ignorado por git y sobrevive al reset; build.js usa el
      # tracker más reciente entre data.json y el index.html publicado.
      # Si los 3 intentos fallan el paso sale en ROJO (antes terminaba en verde
      # con el commit sin subir).
      - name: Commit and push if changed
        env:
          FUNNEL_PASSWORD: ${{ secrets.FUNNEL_PASSWORD }}
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions (auto-sync)"
          case "${{ github.event_name }}" in
            repository_dispatch) MSG="auto: sync funnel data desde tracker ($(date +%Y-%m-%d))" ;;
            push)                MSG="auto: rebuild por sync de ascensos/closers ($(date +%Y-%m-%d))" ;;
            *)                   MSG="auto: rebuild manual del tablero ($(date +%Y-%m-%d))" ;;
          esac
          ok=0
          for intento in 1 2 3; do
            git add index.html
            if git diff --staged --quiet; then
              echo "Sin cambios en index.html"
              ok=1; break
            fi
            git commit -m "$MSG"
            if git push origin HEAD:main; then ok=1; break; fi
            echo "push rechazado (intento $intento): se reconstruye sobre la punta de main"
            sleep 5
            git fetch origin main
            git reset --hard origin/main
            node build.js "$FUNNEL_PASSWORD"
          done
          if [ "$ok" != 1 ]; then
            echo "ERROR: index.html no se pudo publicar tras 3 intentos"
            exit 1
          fi
